<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Libardo Transportes</title>
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <img class="login-brand" src="assets/images/logo_preta.png" alt="Libardo Logística &amp; Transportes">
      <h1 id="login-title">Conecte</h1>
      <p class="login-subtitle">Conecte utilizando suas credenciais</p>
      <form id="login-form" class="login-form">
        <label for="login-email">E-mail</label>
        <input id="login-email" name="id" type="email" autocomplete="username" placeholder="seu@email.com" required>

        <label for="login-password">Senha</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>

        <div class="login-options">
          <label class="remember-option" for="remember-me">
            <input id="remember-me" type="checkbox">
            <span>Lembrar-me</span>
          </label>
          <a id="forgot-password" href="#recuperar-senha">Recuperar Senha?</a>
        </div>

        <p id="login-error" class="login-message login-error" role="alert" hidden></p>
        <p id="login-notice" class="login-message login-notice" role="status" hidden></p>
        <button id="login-submit" type="submit">Entrar</button>
      </form>
    </section>
  </main>
  <script type="module" src="js/login.js"></script>
</body>
</html>
