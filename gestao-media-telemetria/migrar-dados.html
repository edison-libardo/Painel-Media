<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Migrar dados | Libardo Transportes</title>
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
</head>
<body class="min-h-screen bg-light-surface text-light-on-surface font-body antialiased flex flex-col">
  <header class="bg-primary text-on-primary sticky top-0 z-40 border-b border-secondary/40 shadow-sm">
    <div class="px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
      <a href="index.html" class="font-bold text-white">LIBARDO Transportes</a>
      <nav aria-label="Navega&#231;&#227;o principal" class="flex items-center gap-2"></nav>
    </div>
  </header>
  <main class="mx-auto w-full max-w-2xl flex-1 p-6">
    <h1 class="text-2xl font-bold text-primary">Migrar dados compartilhados</h1>
    <p class="mt-2 text-sm text-light-on-surface-variant">Selecione os arquivos <code>shared-dashboard.json</code> e <code>shared-history.json</code> da pasta data do projeto. Esta ação substitui os dados online atuais.</p>
    <form id="migration-form" class="mt-6 space-y-4 rounded-xl border border-light-outline bg-white p-5 shadow-sm">
      <label class="block text-sm font-semibold">Dados do painel
        <input id="migration-dashboard" type="file" accept=".json,application/json" required class="mt-1 block w-full rounded-md border border-light-outline p-2">
      </label>
      <label class="block text-sm font-semibold">Históricos
        <input id="migration-history" type="file" accept=".json,application/json" required class="mt-1 block w-full rounded-md border border-light-outline p-2">
      </label>
      <label class="flex items-start gap-2 text-sm text-rose-800">
        <input id="migration-confirm" type="checkbox" required class="mt-1">
        <span>Confirmo que esta migração deve substituir os dados atuais do Firebase.</span>
      </label>
      <p id="migration-status" role="status" aria-live="polite" class="text-sm" hidden></p>
      <button id="migration-submit" type="submit" class="rounded-md bg-primary px-4 py-2 font-semibold text-white hover:bg-slate-700">Migrar dados</button>
    </form>
  </main>
  <script type="module" src="js/app-bootstrap.js"></script>
</body>
</html>
