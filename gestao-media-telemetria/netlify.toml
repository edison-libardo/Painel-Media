[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/data/*"
  to = "/login.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/login.html"
  status = 404
  force = true
