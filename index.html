<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Libardo Transportes — Painel</title>
  <script>
    if (window.location.protocol === "file:") {
      document.addEventListener("DOMContentLoaded", () => {
        document.body.innerHTML = `
          <main style="max-width:640px;margin:12vh auto;padding:24px;font:16px/1.6 Arial,sans-serif;color:#172033">
            <h1>Abra o painel por HTTP</h1>
            <p>O navegador não executa os módulos JavaScript quando o HTML é aberto diretamente pelo protocolo file://.</p>
            <p>Para desenvolvimento local, inicie um servidor HTTP na pasta gestao-media-telemetria (por exemplo, py -m http.server 8000) e acesse http://localhost:8000. Em produção, acesse a URL publicada no Netlify.</p>
          </main>`;
      });
    } else {
      window.location.replace("gestao-media-telemetria/index.html");
    }
  </script>
</head>
<body>
  <p>Abrindo o painel Libardo Transportes…</p>
</body>
</html>
